<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>مواعيد اللقاءات - coderz</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="schedule-container">
    <header class="page-header">
      <h1 class="page-title">مواعيد اللقاءات</h1>
      <p class="page-subtitle">تابع لقاءاتك القادمة واستعد للتطبيق.</p>
    </header>

    <section class="meetings-list">
      <article class="meeting-card card-blue">
        <div class="badge-row">
          <span class="badge">اللقاء القادم</span>
        </div>

        <h2 class="meeting-title">أساسيات HTML</h2>

        <p class="meeting-description">نرتب محتوى الصفحة ونستخدم العناصر المناسبة.</p>

        <p class="meeting-time">السبت - 10:00 صباحًا</p>

        <div class="action-row">
          <a href="#details-1" class="btn">تفاصيل اللقاء</a>
        </div>
      </article>

      <article class="meeting-card card-green">
        <div class="badge-row">
          <span class="badge">الأسبوع القادم</span>
        </div>

        <h2 class="meeting-title">تنسيق الصفحات باستخدام CSS</h2>

        <p class="meeting-description">ننشق النصوص والألوان ونضبط المسافات.</p>

        <p class="meeting-time">الاثنين - 5:00 مساءً</p>

        <div class="action-row">
          <a href="#details-2" class="btn">تفاصيل اللقاء</a>
        </div>
      </article>
    </section>
  </main>
</body>
</html>
