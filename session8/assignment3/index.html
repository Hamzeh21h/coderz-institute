<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <title>بطاقة تعريف مدرب</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

        <img src="Imeges/trainer.jpeg" alt="صورة المدرب أحمد خالد" class="trainer-img">
